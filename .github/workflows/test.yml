name: Harness tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y liblua5.4-0
        if: runner.os == 'Linux'
      - run: python -m unittest discover -s tests -v
        env:
          GPT64_REQUIRE_LUA: ${{ runner.os == 'Linux' && '1' || '' }}
